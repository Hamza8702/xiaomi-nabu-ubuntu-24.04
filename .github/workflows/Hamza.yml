name: Build Ubuntu image for Xiaomi Pad 5 (nabu)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Ubuntu Version'
        required: true
        default: '26.04'
      extra_packages:
        description: 'Additional packages to install'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xz-utils coreutils curl e2fsprogs

      - name: Create RootFS Image
        run: |
          VERSION="${{ github.event.inputs.version }}"
          EXTRA_PACKAGES="${{ github.event.inputs.extra_packages }}"

          # 1. Create and format image
          truncate -s 6G rootfs.img
          mkfs.ext4 rootfs.img
          mkdir -p rootdir
          sudo mount -o loop rootfs.img rootdir

          # 2. Download and Extract Ubuntu Base
          if [ "$VERSION" = "26.04" ]; then
            URL="https://cdimage.ubuntu.com/ubuntu-base/releases/26.04/release/ubuntu-base-26.04-base-arm64.tar.gz"
          else
            URL="https://cdimage.ubuntu.com/ubuntu-base/releases/$VERSION/release/ubuntu-base-$VERSION-base-arm64.tar.gz"
          fi

          echo "Downloading from: $URL"
          wget --no-verbose $URL -O ubuntu-base.tar.gz
          sudo tar xzvf ubuntu-base.tar.gz -C rootdir

          # 3. Setup Config Files (Varsa kopyala, yoksa hata verme)
          sudo mkdir -p rootdir/var/lib/gdm3/.config
          sudo mkdir -p rootdir/etc/skel/.config/dconf

          [ -f root-setup-files/monitors.xml ] && sudo cp root-setup-files/monitors.xml rootdir/var/lib/gdm3/.config/monitors.xml || true
          [ -f root-setup-files/monitors.xml ] && sudo cp root-setup-files/monitors.xml rootdir/etc/skel/.config/monitors.xml || true
          [ -f root-setup-files/console-setup ] && sudo cp root-setup-files/console-setup rootdir/etc/default/console-setup || true
          [ -f root-setup-files/user ] && sudo cp root-setup-files/user rootdir/etc/skel/.config/dconf/ || true
          [ -f root-setup-files/bash_aliases ] && sudo cp root-setup-files/bash_aliases rootdir/etc/skel/.bash_aliases || true

          # 4. Bind Mounts
          sudo mount --bind /dev rootdir/dev
          sudo mount --bind /dev/pts rootdir/dev/pts
          sudo mount --bind /proc rootdir/proc
          sudo mount --bind /sys rootdir/sys

          # 5. Network and Hostname
          echo "nameserver 1.1.1.1" | sudo tee rootdir/etc/resolv.conf
          echo "nabu" | sudo tee rootdir/etc/hostname
          echo -e "127.0.0.1 localhost\n127.0.1.1 nabu" | sudo tee rootdir/etc/hosts

          # 6. First Chroot (Locales & Repos)
          sudo chroot rootdir /bin/bash <<EOF
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:\$PATH
          export DEBIAN_FRONTEND=noninteractive
          export LANG=C.UTF-8
          export LC_ALL=C.UTF-8

          apt update || true
          apt install -y locales ca-certificates gnupg

          echo "en_US.UTF-8 UTF-8" > /etc/locale.gen
          locale-gen en_US.UTF-8
          update-locale LANG=en_US.UTF-8
          EOF

          # Custom Repositories Copy
          [ -f root-setup-files/xiaomi-nabu.sources ] && sudo cp root-setup-files/xiaomi-nabu.sources rootdir/etc/apt/sources.list.d/xiaomi-nabu.sources || true
          [ -f root-setup-files/themojoman.gpg ] && sudo cp root-setup-files/themojoman.gpg rootdir/etc/apt/keyrings/themojoman.gpg || true

          # 7. Main Chroot (Packages & Configuration)
          sudo chroot rootdir /bin/bash <<EOF
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:\$PATH
          export DEBIAN_FRONTEND=noninteractive
          export LANG=en_US.UTF-8
          unset LC_ALL

          apt update

          apt install -y bash-completion sudo ssh nano micro curl alsa-ucm-conf bluez
          apt install -y rmtfs protection-domain-mapper tqftpserv
          apt install -y systemd-boot-efi systemd-ukify
          apt install -y xiaomi-nabu-alsa xiaomi-nabu-firmware
          
          # Çekirdek paketlerinden 6.17'yi dener, yoksa 6.14'e düşer
          apt install -y xiaomi-nabu-linux-6.17 || apt install -y xiaomi-nabu-linux-6.14
          
          apt install -y zram-config

          # Extra packages boş değilse kur
          if [ -n "$EXTRA_PACKAGES" ]; then
            apt install -y $EXTRA_PACKAGES
          fi

          apt --fix-broken install -y
          apt install -y plasma-mobile plasma-mobile-tweaks spacebar dialer kdeconnect maliit-keyboard
          apt --fix-broken install -y
          apt upgrade -y
          apt --fix-broken install -y

          [ -f /lib/systemd/system/pd-mapper.service ] && sed -i '/ConditionKernelVersion/d' /lib/systemd/system/pd-mapper.service || true
          [ -f /usr/bin/init-zram-swapping ] && sed -i '/^totalmem/ s/^/#/' /usr/bin/init-zram-swapping || true
          [ -f /usr/bin/init-zram-swapping ] && sed -i '/^mem/ s/.*/#&\nmem=10GiB/' /usr/bin/init-zram-swapping || true

          apt clean
          systemctl enable bluetooth || true
          EOF

          # 8. fstab Setup
          echo "PARTLABEL=linux / ext4 errors=remount-ro,x-systemd.growfs 0 1" | sudo tee rootdir/etc/fstab

          # Copy EFI files out of the chroot before unmounting
          sudo cp rootdir/boot/*.efi . || echo "No EFI files found"

          # Safe Unmount
          sudo umount -l rootdir/sys || true
          sudo umount -l rootdir/proc || true
          sudo umount -l rootdir/dev/pts || true
          sudo umount -l rootdir/dev || true
          sudo umount -l rootdir || true

      - name: Compress Image
        id: compress
        run: |
          VERSION="${{ github.event.inputs.version }}"
          FILENAME="ubuntu-${VERSION}-xiaomi-nabu.img.xz"
          xz -6 rootfs.img
          mv rootfs.img.xz "$FILENAME"
          echo "img_name=$FILENAME" >> $GITHUB_OUTPUT

      - name: Upload RootFS image
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.compress.outputs.img_name }}
          path: ${{ steps.compress.outputs.img_name }}
          if-no-files-found: error

      - name: Upload EFI Binaries
        uses: actions/upload-artifact@v5
        with:
          name: efi-files
          path: ./*.efi
          if-no-files-found: warn
